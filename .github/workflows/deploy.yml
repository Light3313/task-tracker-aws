name: Deploy
on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.login-ecr.outputs.registry }}/${{ steps.export-env.outputs.repo }}
    env:
      ECR_REPOSITORY: task-tracker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: ./scripts/build.sh ${{ github.sha }}
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::486949319589:role/tt-terraform-deployer
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: ./scripts/push.sh ${{ github.sha }}
        
      - name: Export ENV to Job Outputs
        id: export-env
        run: echo "repo=$ECR_REPOSITORY" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::486949319589:role/tt-terraform-deployer
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Deploy with Terraform
        run: |
          cd "infra/environments/dev"
          terraform init
          terraform apply -auto-approve -var "app_image=${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"