name: Deploy
on:
  push:
    branches: [ main ]

# One deployment at a time: parallel runs would contend for the same Terraform
# state lock.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.login-ecr.outputs.registry }}/task-tracker
    env:
      ECR_REPOSITORY: task-tracker

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Docker image
        run: ./scripts/build.sh ${{ github.sha }}
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::486949319589:role/tt-terraform-deployer
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: ./scripts/push.sh ${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::486949319589:role/tt-terraform-deployer
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7

      - name: Deploy with Terraform
        working-directory: infra/environments/dev
        run: |
          terraform init
          terraform apply -auto-approve -var "app_image=${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"

      - name: Report deployed URL
        working-directory: infra/environments/dev
        run: |
          {
            echo "### Deployed to dev"
            echo ""
            echo "- App: https://$(terraform output -raw app_url)"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
