name: CI
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: task-tracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: task-tracker:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: 'CRITICAL,HIGH'

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  config-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Terraform for misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          format: sarif
          output: trivy-config.sarif
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Upload Terraform scan results
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::486949319589:role/tt-terraform-planner
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
        
      - name: Terraform Init
        working-directory: infra/environments/dev
        run: terraform init -input=false

      - name: Get Terraform app_image
        working-directory: infra/environments/dev
        run: | 
          IMAGE=$(terraform output -json | jq -r '.app_image.value // "none"')
          printf 'IMAGE=%s\n' "$IMAGE" >> "$GITHUB_ENV"

      - name: Terraform plan
        working-directory: infra/environments/dev
        id: plan
        continue-on-error: true
        run: terraform plan -var "app_image=$IMAGE" -input=false -no-color -lock=false

      - name: Report Terraform plan
        working-directory: infra/environments/dev
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          ERR: ${{ steps.plan.outputs.stderr }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "### Terraform plan (exit ${CODE:-unknown})"
            echo ""
            if [ -n "$ERR" ]; then
              echo "**stderr**"
              echo ""
              echo '```'
              echo "$ERR"
              echo '```'
              echo ""
            fi
            echo '<details><summary>Show plan</summary>'
            echo ""
            echo '```terraform'
            echo "$PLAN"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
